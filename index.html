<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fine-Surgical Order Calculator</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#6b7686;--bd:#d9dee7;--pri:#0b3a8c;--pri-tx:#fff;--ref:#8a6d00;--refbg:#fff7dc;--del:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2130;--tx:#e8edf5;--mut:#9aa6b8;--bd:#2b3548;--pri:#4d8dff;--pri-tx:#08111f;--ref:#e6c34d;--refbg:#2b2610;--del:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2130;--tx:#e8edf5;--mut:#9aa6b8;--bd:#2b3548;--pri:#4d8dff;--pri-tx:#08111f;--ref:#e6c34d;--refbg:#2b2610;--del:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
select,input[type=number]{width:100%;font-size:17px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.full{grid-column:1/-1}
button{font-size:16px;font-weight:600;border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
.add{background:var(--pri);color:var(--pri-tx);width:100%}
.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.item{border-bottom:1px solid var(--bd);padding:10px 0}
.item:last-child{border-bottom:0}
.it-top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.it-sub{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:3px}
.ref{color:var(--ref);background:var(--refbg);border-radius:6px;padding:1px 6px;font-size:12px}
.than{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;margin-top:6px;font-size:13px;line-height:1.7;color:var(--mut)}
.than b{color:var(--tx)}
.x{background:none;color:var(--del);padding:2px 6px;font-size:18px}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:16px}
.grand{font-size:22px;font-weight:700;border-top:2px solid var(--bd);margin-top:6px;padding-top:10px}
.refrow{margin-top:8px;background:var(--refbg);color:var(--ref);border-radius:10px;padding:8px 10px;font-size:14px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.sw input{width:20px;height:20px}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>Order Calculator</h1>
<div class="card">
 <div class="row">
  <div><label>Quality</label><select id="q"><option value="30">Super Fine 30 TPI</option><option value="40">Deluxe 40 TPI</option><option value="46">Premium 46 TPI</option></select></div>
  <div><label>Width (cm)</label><select id="w"></select></div>
  <div><label>Length (m)</label><select id="l"></select></div>
  <div><label>Packet (qty)</label><input id="n" type="number" inputmode="numeric" min="1" value="1"></div>
  <div class="full"><button class="add" id="add">+ Add karein</button></div>
 </div>
 <div class="hint" id="rate"></div>
</div>
<div class="card">
 <div id="list"></div>
</div>
<div class="card">
 <div class="sw"><input type="checkbox" id="gst" checked><label for="gst" style="margin:0;font-size:14px;color:var(--tx)">GST 5% jodein</label></div>
 <div class="sw" id="refsw" style="display:none"><input type="checkbox" id="showref" checked><label for="showref" style="margin:0;font-size:14px;color:var(--tx)">Ref dikhayein</label></div>
 <div class="sw" id="lockrow"><button class="ghost" id="unlock" style="padding:6px 10px;font-size:13px">&#128274; Ref</button><input id="pin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="PIN" style="display:none;width:110px;padding:8px;font-size:15px"><button class="ghost" id="pinok" style="display:none;padding:6px 10px;font-size:13px">OK</button></div>
 <div class="sw"><input type="checkbox" id="showthan" checked><label for="showthan" style="margin:0;font-size:14px;color:var(--tx)">Than ka hisab dikhayein</label></div>
 <div class="tot"><span>Total packet</span><b id="tp">0</b></div>
 <div class="tot"><span>Amount</span><b id="sub">₹0.00</b></div>
 <div class="tot" id="gstrow"><span>GST 5%</span><b id="gstv">₹0.00</b></div>
 <div class="tot grand"><span>Grand Total</span><span id="gt">₹0.00</span></div>
 <div class="refrow" id="refrow">Ref. Code: <b id="refv">0.00</b></div>
 <div class="than" id="thsum" style="display:none"></div>
 <div class="btns"><button class="ghost" id="copy">Bill copy karein</button><button class="ghost" id="clear">Sab hataein</button></div>
 <div class="hint" id="msg"></div>
</div>
</div>
<script>
var LENS=[2,2.5,3,3.5,4,4.5,5,7,8,10];
var WID=[5,6,7.5,9,10,15];
var WP={5:21,6:17,7.5:14,9:11,10:10,15:7};
var LP={2:10,2.5:8,3:6,3.5:5,4:5,4.5:4,5:4,6:3,7:2,8:2,10:2};
var THAN=null;var ENC={s:"Xqqj/D4Ux0gKSvfk6U/NHg==",v:"goncqfU+97mz7FDy",i:600000,d:"6oWENyfpktCdBJ3kWQrSJAn0/0jyjMBDUmVGnNdTDax5QpddwvJYBvzG/QE6mDIEAA=="};
var NAME={30:"Super Fine 30 TPI",40:"Deluxe 40 TPI",46:"Premium 46 TPI"};
var S={
30:{5:[14.80,17.70,21.75,27.50,30.95,32.75,38.95,53.20,58.90,60.90],6:[18.55,22.70,30.50,34.60,38.35,40.55,43.30,61.75,66.65,70.95],7.5:[21.55,26.45,33.85,36.80,41.40,44.50,50.85,75.70,78.65,85.90],9:[24.75,28.95,36.75,42.50,45.55,50.75,53.55,95.55,105.85,115.50],10:[27.55,30.80,39.55,45.85,48.75,53.50,60.90,105.65,115.65,125.50],15:[37.80,43.70,54.95,62.60,68.95,75.95,88.55,158.85,160.60,162.90]},
40:{5:[19.80,22.30,26.30,31.65,34.55,38.70,43.05,73.65,75.70,80.55],6:[22.80,25.75,34.75,38.75,42.55,44.95,51.35,90.80,92.50,95.95],7.5:[26.95,30.70,37.70,45.35,50.65,54.80,63.40,109.60,111.65,120.55],9:[30.55,35.80,46.65,55.55,57.75,69.80,71.55,138.65,140.55,142.75],10:[32.70,42.55,51.55,61.80,63.50,76.85,78.50,152.70,154.95,156.65],15:[48.90,57.50,73.75,87.60,89.60,109.75,111.50,217.55,219.50,221.80]},
46:{5:[30.80,32.90,38.70,42.90,44.80,50.65,55.95,83.85,85.65,95.50],6:[33.50,35.65,41.50,45.55,50.70,55.75,65.50,102.80,104.75,110.80],7.5:[36.80,40.80,47.50,55.95,58.65,62.70,73.75,124.85,126.75,135.75],9:[40.70,45.85,53.80,63.60,65.70,79.65,81.95,157.75,159.55,161.60],10:[42.55,52.80,57.75,69.80,71.65,87.60,89.75,173.75,175.80,177.70],15:[58.60,67.80,83.50,99.95,101.70,124.80,126.95,247.75,249.95,251.85]}};
var SPECIAL={price:47.55}; /* 30 TPI, 6 cm x 6 m */
var items=[];
var $=function(i){return document.getElementById(i)};
function fm(x){return x.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function lensFor(q,w){var a=LENS.slice();if(q==30&&w==6){a.push(6);a.sort(function(x,y){return x-y})}return a}
function price(q,w,l){
 if(q==30&&w==6&&l==6)return SPECIAL.price;
 return S[q][w][LENS.indexOf(l)];
}
function cost(q,w,l){return THAN[q]/(WP[w]*LP[l])*12}
function fi(x){return x.toLocaleString("en-IN")}
function fillW(){var h="";WID.forEach(function(w){h+='<option value="'+w+'">'+w+' cm</option>'});$("w").innerHTML=h;fillL()}
function fillL(){
 var q=+$("q").value,w=+$("w").value,cur=$("l").value,h="";
 lensFor(q,w).forEach(function(l){h+='<option value="'+l+'">'+l+' m</option>'});
 $("l").innerHTML=h;
 if(cur&&lensFor(q,w).indexOf(+cur)>=0)$("l").value=cur;
 showRate();
}
function showRate(){
 var q=+$("q").value,w=+$("w").value,l=+$("l").value;
 $("rate").textContent="Rate: ₹"+fm(price(q,w,l))+" per packet (12 roll)";
}
function render(){
 var h="",tp=0,sub=0,ref=0,tt=0,tcs=0,trolls=0,tgot=0,tgp=0;
 var sr=!!THAN&&$("showref").checked;
 var st=$("showthan").checked;
 items.forEach(function(it,i){
  var amt=it.p*it.n,rf=THAN?(it.p-cost(it.q,it.w,it.l))*it.n:0;
  var rt=WP[it.w]*LP[it.l],rolls=it.n*12,tx=rolls/rt,tc=Math.ceil(tx-1e-9),got=tc*rt,extra=got-rolls;
  tp+=it.n;sub+=amt;ref+=rf;tt+=tx;tcs+=tc;trolls+=rolls;tgot+=got;tgp+=Math.floor(got/12);
  h+='<div class="item"><div class="it-top"><span>'+NAME[it.q]+' | '+it.w+' cm x '+it.l+' m</span><button class="x" data-i="'+i+'">×</button></div>'
   +'<div class="it-sub"><span>'+it.n+' pkt x ₹'+fm(it.p)+'</span><b style="color:var(--tx)">₹'+fm(amt)+'</b></div>'
   +(st?'<div class="than">1 than = <b>'+fi(rt)+' roll</b><br>Lagenge: <b>'+fm(tx)+' than</b> &rarr; <b>'+tc+' than</b> (poore)<br>Roll niklenge: <b>'+fi(got)+'</b> ('+fi(Math.floor(got/12))+' pkt)<br>Order: '+fi(rolls)+' roll | extra bache: <b>'+fi(extra)+' roll</b></div>':'')
   +(sr?'<div class="it-sub"><span></span><span class="ref">ref '+fm(rf)+'</span></div>':'')+'</div>';
 });
 $("list").innerHTML=h||'<div class="empty">Abhi koi item nahi. Upar se add karein.</div>';
 var g=$("gst").checked,gv=g?sub*0.05:0;
 $("tp").textContent=tp;
 $("sub").textContent="₹"+fm(sub);
 $("gstv").textContent="₹"+fm(gv);
 $("gstrow").style.display=g?"flex":"none";
 $("gt").textContent="₹"+fm(sub+gv);
 $("refrow").style.display=sr?"block":"none";
 $("refv").textContent=fm(ref);
 $("thsum").style.display=(items.length&&st)?"block":"none";
 $("thsum").innerHTML='<b>Than ka hisab (sab size)</b><br>Kul roll chahiye: <b>'+fi(trolls)+'</b> ('+fi(tp)+' pkt)<br>Kul than (hisab se): <b>'+fm(tt)+'</b><br>Kul than (poore lagenge): <b>'+fi(tcs)+'</b><br>Kul roll niklenge: <b>'+fi(tgot)+'</b> ('+fi(tgp)+' pkt)<br>Extra roll bache: <b>'+fi(tgot-trolls)+'</b><br><span style="font-size:12px">Har size ka than alag round hota hai, ek than me do size nahi kat'+'te.</span>';
}
$("q").onchange=fillL;$("w").onchange=fillL;$("l").onchange=showRate;
$("add").onclick=function(){
 var q=+$("q").value,w=+$("w").value,l=+$("l").value,n=Math.floor(+$("n").value);
 if(!(n>0)){$("msg").textContent="Packet ki sankhya 1 ya zyada likhein.";return}
 $("msg").textContent="";
 var found=items.filter(function(x){return x.q==q&&x.w==w&&x.l==l})[0];
 if(found)found.n+=n;else items.push({q:q,w:w,l:l,n:n,p:price(q,w,l)});
 $("n").value=1;render();
};
$("list").onclick=function(e){var b=e.target.closest(".x");if(b){items.splice(+b.dataset.i,1);render()}};
$("gst").onchange=render;$("showref").onchange=render;$("showthan").onchange=render;
$("clear").onclick=function(){items=[];render()};
$("copy").onclick=function(){
 var t="FINE-SURGICAL ORDER\n",sub=0;
 items.forEach(function(it){t+=NAME[it.q]+" "+it.w+"cm x "+it.l+"m: "+it.n+" pkt x "+fm(it.p)+" = "+fm(it.p*it.n)+"\n";sub+=it.p*it.n});
 t+="Amount: "+fm(sub)+"\n";
 if($("gst").checked){t+="GST 5%: "+fm(sub*0.05)+"\n";t+="Total: "+fm(sub*1.05)}else t+="Total: "+fm(sub);
 try{navigator.clipboard.writeText(t).then(function(){$("msg").textContent="Bill copy ho gaya (ref nahi hai isme)."},function(){$("msg").textContent="Copy nahi hua."})}catch(e){$("msg").textContent="Copy nahi hua."}
};

function b64(x){var b=atob(x),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function tryPin(pin){
 var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
 var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.v)},key,b64(ENC.d));
 return JSON.parse(new TextDecoder().decode(pt));
}
$("unlock").onclick=function(){$("pin").style.display="inline-block";$("pinok").style.display="inline-block";$("pin").focus()};
$("pinok").onclick=function(){
 if(!(window.crypto&&crypto.subtle)){$("msg").textContent="Ye sirf https link par chalega.";return}
 tryPin($("pin").value.trim().toLowerCase()).then(function(o){
  THAN=o;$("lockrow").style.display="none";$("refsw").style.display="flex";$("msg").textContent="";render();
 },function(){$("msg").textContent="PIN galat hai.";$("pin").value=""});
};
fillW();render();
</script>
</body>
</html>
